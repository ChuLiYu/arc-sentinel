# Pilot stack; see docs/RUNBOOK.md. Host configuration is pre-provisioned.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    image: ${SENTINEL_IMAGE:?set SENTINEL_IMAGE to a tested commit tag or digest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-sentinel}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.indexer.worker"]

  api:
    image: ${SENTINEL_IMAGE:?set SENTINEL_IMAGE to a tested commit tag or digest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-sentinel}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    environment:
      ARC_SENTINEL_DOMAIN: ${ARC_SENTINEL_DOMAIN:?set the public hostname}
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
