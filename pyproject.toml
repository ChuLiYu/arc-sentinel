[project]
name = "arc-sentinel"
version = "0.1.0"
description = "Arc Sentinel — non-custodial read-only monitoring of Agent wallet USDC flows on Arc mainnet"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Arc Sentinel contributors" }]
keywords = ["arc", "usdc", "indexer", "monitoring", "evm"]
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.1.19,<4",
    "alembic>=1.13.2,<2",
    "pydantic>=2.8.2,<3",
    "pydantic-settings>=2.3.4,<3",
    "httpx>=0.27.0,<1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.2.2,<9",
    "pytest-asyncio>=0.23.8,<1",
    "pytest-cov>=7.1.0",
    "respx>=0.21.1,<1",
    "ruff>=0.5.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends(...) as a default arg is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBearer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
