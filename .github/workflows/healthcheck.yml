name: Health Check

# Scheduled liveness probe against the public /health endpoint.
# A failed/degraded probe fails this run. There is no cross-run failure counter.
on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (SPEC §12)
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    if: vars.ARC_SENTINEL_DOMAIN != ''
    steps:
      - name: Probe /health
        run: |
          body="$(curl -fsS --max-time 20 "https://${{ vars.ARC_SENTINEL_DOMAIN }}/api/v1/health" || true)"
          if [ -z "$body" ]; then
            echo "::error::health endpoint unreachable"
            exit 1
          fi
          echo "$body" | jq -e '.status == "ok"' >/dev/null \
            || { echo "::error::unexpected health payload: $body"; exit 1; }
          echo "health ok: $body"
