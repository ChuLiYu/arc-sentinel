name: Deploy

# Historical deployment draft. Intentionally disabled; see SECURITY.md.
# Secrets consumed (SPEC §17 credentials map):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY — SSH into VM
#   ARC_MAINNET_RPC_URL — Alchemy mainnet RPC (written into VM .env)
#   ARC_MAINNET_RPC_FALLBACK_URL — dRPC mainnet fallback (Phase 2.5)
#   POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB — DB credentials
#   SENTINEL_API_KEY_SALT — hash salt for write-scope API keys
#   vars.ARC_SENTINEL_DOMAIN — public domain for Caddy TLS
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Disabled for the public portfolio release; requires a separate deployment review.
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Render production .env and restart stack on VM
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          RPC_URL: ${{ secrets.ARC_MAINNET_RPC_URL }}
          RPC_FALLBACK: ${{ secrets.ARC_MAINNET_RPC_FALLBACK_URL }}
          CHAIN_ID: "5042"
          PG_USER: ${{ secrets.POSTGRES_USER }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          PG_DB: ${{ secrets.POSTGRES_DB }}
          API_KEY_SALT: ${{ secrets.SENTINEL_API_KEY_SALT }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${USER}@${HOST} '
            set -e
            cd ~/arc-sentinel
            git pull --ff-only
            # CI/CD is the source of truth for production secrets (SPEC §17):
            cat > .env <<EOF
            DATABASE_URL=postgresql+psycopg://'$PG_USER':'$PG_PASS'@localhost:5432/'$PG_DB'
            ARC_MAINNET_RPC_URL='$RPC_URL'
            ARC_MAINNET_RPC_FALLBACK_URL='$RPC_FALLBACK'
            CHAIN_ID='$CHAIN_ID'
            POSTGRES_USER='$PG_USER'
            POSTGRES_PASSWORD='$PG_PASS'
            POSTGRES_DB='$PG_DB'
            SENTINEL_API_KEY_SALT='$API_KEY_SALT'
            EOF
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
          '

      - name: Smoke check
        run: curl -fsS --max-time 30 "https://${{ vars.ARC_SENTINEL_DOMAIN }}/api/v1/health"