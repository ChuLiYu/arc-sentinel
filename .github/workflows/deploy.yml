name: Deploy pilot (manual)

# Intentionally disabled for the public portfolio release; see SECURITY.md.
# Re-enable only after the launch gates in docs/ROADMAP.md and a separate deployment review.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full tested commit SHA (image tag and configuration revision)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pilot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }}
    environment: pilot
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REVISION: ${{ inputs.revision }}
      DOMAIN: ${{ vars.ARC_SENTINEL_DOMAIN }}
    steps:
      - name: Validate inputs and pin SSH host identity
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DOMAIN" =~ ^[a-zA-Z0-9.-]+$ ]]
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy tested revision using pre-provisioned host configuration
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$REVISION"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" bash -s -- "$REVISION" "$image" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          export SENTINEL_IMAGE="$2"
          cd ~/arc-sentinel
          test -f .env.production
          git fetch origin main
          git merge-base --is-ancestor "$revision" origin/main
          git checkout --detach "$revision"
          compose() { docker compose --env-file .env.production -f docker-compose.prod.yml "$@"; }
          compose config --quiet
          compose pull
          compose up -d --wait postgres
          compose stop api indexer
          compose run --rm --no-deps api python -m alembic upgrade head
          compose up -d
          REMOTE

      - name: Check service health
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsS --max-time 15 "https://$DOMAIN/api/v1/health" | jq -e '.status == "ok"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
